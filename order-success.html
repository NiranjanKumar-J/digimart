<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DigiMart | Order Success</title>

    <link rel="stylesheet"
        href="css/order-success.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="success-container">

        <div class="success-icon">

            <i class="fa-solid fa-check"></i>

        </div>


        <h1>Order Placed Successfully!</h1>

        <p class="message">
            Thank you for shopping with DigiMart.
        </p>


        <div class="order-box">

            <p>
                <strong>Order ID:</strong>
                <span id="order-id">Loading...</span>
            </p>

            <p>
                <strong>Customer:</strong>
                <span id="customer-name">Loading...</span>
            </p>

            <p>
                <strong>Payment:</strong>
                <span id="payment-method">Loading...</span>
            </p>

            <p>
                <strong>Order Date:</strong>
                <span id="order-date">Loading...</span>
            </p>

            <p>
                <strong>Total:</strong>
                <span id="order-total">₹0</span>
            </p>

        </div>


        <div class="buttons">

            <a href="products.html"
                class="shop-btn">

                <i class="fa-solid fa-cart-shopping"></i>

                Continue Shopping

            </a>


            <a href="index.html"
                class="home-btn">

                <i class="fa-solid fa-house"></i>

                Back to Home

            </a>

        </div>

    </div>


    <script src="js/order-success.js"></script>

</body>

</html>
