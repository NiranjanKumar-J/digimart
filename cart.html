<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigiMart | Cart</title>

    <link rel="stylesheet" href="css/cart.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <nav class="navbar">

            <div class="logo">

                <i class="fa-solid fa-bolt"></i>

                <span>DigiMart</span>

            </div>


            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html" class="active">
                    Cart
                </a>

            </div>


            <div class="nav-icons">

                <a href="cart.html" class="cart-icon">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span id="cart-count">0</span>

                </a>

                <a href="profile.html">

                    <i class="fa-regular fa-user"></i>

                </a>

            </div>

        </nav>

    </header>


    <!-- PAGE TITLE -->

    <section class="page-title">

        <h1>Shopping Cart</h1>

        <p>Review your products before checkout.</p>

    </section>


    <!-- CART -->

    <section class="cart-section">

        <div class="cart-container">


            <!-- PRODUCTS -->

            <div class="cart-products">

                <h2>Your Cart</h2>

                <div id="cart-items">

                    <!-- Products will be loaded using JavaScript -->

                </div>

            </div>


            <!-- SUMMARY -->

            <div class="cart-summary">

                <h2>Order Summary</h2>


                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="subtotal">₹0</span>

                </div>


                <div class="summary-row">

                    <span>Delivery</span>

                    <span id="delivery">₹0</span>

                </div>


                <hr>


                <div class="summary-total">

                    <span>Total</span>

                    <span id="total">₹0</span>

                </div>


                <button id="checkout-btn">

                    <i class="fa-solid fa-credit-card"></i>

                    Proceed to Checkout

                </button>


                <a href="products.html" class="continue-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Continue Shopping

                </a>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-content">

            <h2>DigiMart</h2>

            <p>
                Your One Stop Destination for Premium Electronics.
            </p>

            <div class="social-icons">

                <i class="fa-brands fa-facebook"></i>

                <i class="fa-brands fa-instagram"></i>

                <i class="fa-brands fa-x-twitter"></i>

                <i class="fa-brands fa-youtube"></i>

            </div>

            <p class="copy">

                © 2026 DigiMart. All Rights Reserved.

            </p>

        </div>

    </footer>


    <script src="js/cart.js"></script>

</body>

</html>
