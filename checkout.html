<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigiMart | Checkout</title>

    <link rel="stylesheet" href="css/checkout.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    

    <header>

        <nav class="navbar">

            <div class="logo">

                <i class="fa-solid fa-bolt"></i>

                <span>DigiMart</span>

            </div>


            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </div>

        </nav>

    </header>


    

    <section class="page-title">

        <h1>Checkout</h1>

        <p>Complete your order securely.</p>

    </section>


    

    <section class="checkout-section">

        <div class="checkout-container">


            

            <div class="checkout-form">

                <h2>
                    <i class="fa-solid fa-location-dot"></i>
                    Delivery Details
                </h2>


                <form id="checkoutForm">


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            maxlength="10"
                            placeholder="Enter mobile number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            placeholder="Enter your delivery address"
                            required
                        ></textarea>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="city">
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                placeholder="City"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="pincode">
                                PIN Code
                            </label>

                            <input
                                type="text"
                                id="pincode"
                                maxlength="6"
                                placeholder="PIN Code"
                                required
                            >

                        </div>

                    </div>


                    

                    <h2 class="payment-title">

                        <i class="fa-solid fa-credit-card"></i>

                        Payment Method

                    </h2>


                    <div class="payment-options">


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                checked
                            >

                            <span>

                                <i class="fa-solid fa-money-bill"></i>

                                Cash on Delivery

                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="upi"
                            >

                            <span>

                                <i class="fa-solid fa-mobile-screen"></i>

                                UPI

                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="card"
                            >

                            <span>

                                <i class="fa-solid fa-credit-card"></i>

                                Credit / Debit Card

                            </span>

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="place-order-btn"
                    >

                        <i class="fa-solid fa-check"></i>

                        Place Order

                    </button>


                </form>

            </div>


            

            <div class="order-summary">

                <h2>
                    <i class="fa-solid fa-bag-shopping"></i>
                    Order Summary
                </h2>


                <div id="checkout-items">

                    

                </div>


                <hr>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="subtotal">
                        ₹0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span id="delivery">
                        FREE
                    </span>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span id="total">
                        ₹0
                    </span>

                </div>

            </div>

        </div>

    </section>


    

    <footer>

        <h2>DigiMart</h2>

        <p>
            Your One Stop Destination for Premium Electronics.
        </p>

        <p class="copy">
            © 2026 DigiMart. All Rights Reserved.
        </p>

    </footer>


    <script src="js/checkout.js"></script>

</body>

</html>
