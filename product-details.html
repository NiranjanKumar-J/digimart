<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigiMart | Product Details</title>

    <link rel="stylesheet" href="css/product-details.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    

    <header>

        <nav class="navbar">

            <div class="logo">
                <i class="fa-solid fa-bolt"></i>
                <span>DigiMart</span>
            </div>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="products.html">Products</a>

                <a href="cart.html" class="cart-link">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Cart

                    <span id="cart-count">0</span>

                </a>

            </div>

        </nav>

    </header>


    

    <main>

        <section class="details-container">

            

            <div class="product-image">

                <img id="productImage"
                    src=""
                    alt="Product">

            </div>


            

            <div class="product-info">

                <p class="brand" id="productBrand">
                    Brand
                </p>

                <h1 id="productName">
                    Product Name
                </h1>

                <div class="rating" id="productRating">
                    ⭐⭐⭐⭐⭐
                </div>

                <h2 id="productPrice">
                    ₹0
                </h2>

                <p class="description" id="productDescription">
                    Product description
                </p>


                

                <div class="quantity-box">

                    <span>Quantity:</span>

                    <button id="minusBtn">−</button>

                    <span id="quantity">1</span>

                    <button id="plusBtn">+</button>

                </div>


                

                <div class="buttons">

                    <button id="addCartBtn">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Add to Cart

                    </button>

                    <button id="buyBtn">

                        <i class="fa-solid fa-bolt"></i>

                        Buy Now

                    </button>

                </div>


                <a href="products.html" class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Products

                </a>

            </div>

        </section>

    </main>


    

    <footer>

        <h2>DigiMart</h2>

        <p>
            Your One Stop Destination for Premium Electronics.
        </p>

        <p class="copy">
            © 2026 DigiMart. All Rights Reserved.
        </p>

    </footer>


    <script src="js/product-details.js"></script>

</body>

</html>
